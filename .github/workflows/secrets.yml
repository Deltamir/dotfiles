name: secrets

# Secret scan of the whole history on every push and PR. This repo is public
# and pushed from audit machines: a leaked token or client data must fail here.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not only the last one
      - name: gitleaks (whole history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner -v
