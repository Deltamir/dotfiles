# Identity layer template: copy this directory into a new private repository
# (personal, work...). The dotfiles repository uses it on top of its config:
#
#   ~/dotfiles/install.sh --identity <url of the new repository>
#
# install.sh clones this repository to ~/.local/share/dotfiles-identity, links
# it as ~/.dotfiles-identity, and links this file into the mise config's
# conf.d/, where mise merges it. Swapping identities removes these files first
# (`mise dot unapply --group identity`): keep everything in this group.

# home/ mirrors the home directory: dot-<name> is deployed as .<name>.
[dotfile_groups.identity]
root = "~/.dotfiles-identity/home"
target = "~"
mode = "symlink-each"
dot_prefix = true

# Files an application rewrites are copies, not links: `mise run push` brings
# the rewrite back here (aws configure sso writes ~/.aws/config).
[dotfile_groups.identity.entries]
"~/.aws/config" = { mode = "copy", permissions = "0600" }

# --- Beyond files (uncomment what this identity needs) --------------------------
# Tools only this identity uses:
# [tools]
# cf = "latest"
#
# A company root CA, kept in this repository as certs/<name>.crt (a public
# certificate, not a secret). install.sh rebuilds the system bundle when it
# changes; the [env] lines cover tools that ignore the system store.
# [bootstrap.files."/usr/local/share/ca-certificates/company-root.crt"]
# os = "linux"
# owner = "root"
# mode = "0644"
# source = "~/.dotfiles-identity/certs/company-root.crt"
# [env]
# NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"
# REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
#
# apt packages, from an apt source declared here (key fingerprint required):
# [bootstrap.apt.sources.gitlab-runner]
# uris = "https://packages.gitlab.com/runner/gitlab-runner/debian/"
# suites = "trixie"
# components = "main"
# key = "https://packages.gitlab.com/runner/gitlab-runner/gpgkey"
# fingerprint = "F640 3F65 44A3 8863 DAA0 B6E0 3F01 618A 5131 2F3F"
# [bootstrap.packages]
# "apt:gitlab-runner" = "latest"
#
# Do not declare a source the machine gets elsewhere (Docker on the Sarasvati
# VM comes from its playbook): two definitions break apt, and install.sh stops
# on them. Declare the packages only.
