# Global mise config for every machine: WSL, devcontainers, the Sarasvati VM.
# install.sh links ~/.config/mise to this directory and ~/.dotfiles to the
# repository, then runs `mise bootstrap`. No per-context file: what belongs
# to one machine only goes in config.local.toml next to this file (ignored by Git).

[vars]
git_email = "deltamir@hotmail.fr"

# --- System packages (apt: Debian, Ubuntu, Kali) ------------------------------
# Installed with passwordless sudo, or with a password when install.sh runs in
# a terminal; skipped otherwise, with the command to run printed.
[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:unzip" = "latest"
"apt:build-essential" = "latest"
"apt:libatomic1" = "latest"          # node needs it
"apt:zsh" = "latest"
"apt:zsh-autosuggestions" = "latest"
"apt:zsh-syntax-highlighting" = "latest"
"apt:command-not-found" = "latest"
"apt:nano" = "latest"
"apt:jq" = "latest"
"apt:tmux" = "latest"
"apt:screen" = "latest"
"apt:gpg" = "latest"
"apt:pipx" = "latest"
"apt:ent" = "latest"

# --- Repositories --------------------------------------------------------------
# Oh My Zsh at a fixed commit instead of `curl | sh`: bump it in a PR.
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", ref = "87aa1a9b892a3b150f93c53b577a2ec67e617f30" }

# --- Files -----------------------------------------------------------------------
# Sources live in the repository, reached through the ~/.dotfiles link.
# symlink (default): editing ~/.zshrc edits the repository file.
# copy: files an application rewrites; `mise dot add --changed` brings edits back.
# template: values that differ per machine.
[dotfiles]
"~/.zshrc" = "~/.dotfiles/home/zshrc"
"~/.bashrc" = "~/.dotfiles/home/bashrc"
"~/.bash_logout" = "~/.dotfiles/home/bash_logout"
"~/.profile" = "~/.dotfiles/home/profile"
"~/.zsh-custom" = { source = "~/.dotfiles/home/zsh", mode = "symlink-each" }
"~/.gitconfig" = { source = "~/.dotfiles/home/gitconfig.tmpl", mode = "template" }
"~/.config/gh/config.yml" = { source = "~/.dotfiles/home/config/gh/config.yml", mode = "copy" }
"~/.aws/config" = { source = "~/.dotfiles/home/aws/config", mode = "copy", permissions = "0600" }

# --- Tools -----------------------------------------------------------------------
# What Homebrew used to install, now from mise. "latest" tracks upstream;
# pin a version here when it matters (terraform = "1.9").
[tools]
gh = "latest"
glab = "latest"
vault = "latest"
terraform = "latest"
kubectl = "latest"
yq = "latest"
aws-cli = "latest"
docker-cli = "latest"
uv = "latest"
node = "lts"
yarn = "latest"
gitleaks = "latest"     # secret scan of `mise run push`

# --- Checks ----------------------------------------------------------------------
# Runs at the end of every `mise bootstrap`: each tool must answer, as the
# `check` of Sarasvati tools. A failure fails install.sh.
[tasks.bootstrap]
description = "Check that every common tool answers"
run = [
  "gh --version",
  "glab --version",
  "vault --version",
  "terraform -version",
  "kubectl version --client",
  "yq --version",
  "aws --version",
  "docker --version",
  "uv --version",
  "node --version",
  "yarn --version",
  "gitleaks version",
]

# --- Publishing changes ------------------------------------------------------------
# `mise run push`: the only way a change leaves this machine. Brings back the
# copies an application rewrote, shows the full diff, scans it for secrets
# (any finding stops everything), asks, then commits and pushes.
[tasks.push]
description = "Review, scan and publish the local dotfiles changes"
dir = "{{ env.HOME }}/.dotfiles"
raw = true
run = '''
set -eu
mise dot add --changed --yes
git add -A
if git diff --cached --quiet; then
  echo "Nothing to publish."
  exit 0
fi
git --no-pager diff --cached
echo
git --no-pager diff --cached --stat
if ! gitleaks git --staged --pre-commit --redact --no-banner .; then
  echo "gitleaks found a possible secret: nothing was committed. Fix it, then run again." >&2
  git reset -q
  exit 1
fi
printf 'Commit and push these changes? [y/N] '
read -r answer
case "$answer" in
  y | Y | yes | o | oui) ;;
  *) echo "Cancelled; the changes stay staged."; exit 1 ;;
esac
git commit -q -m "dotfiles: changes from $(hostname)"
if ! git pull --rebase -q; then
  echo "Another machine changed the same lines. Resolve in ~/.dotfiles (git status)," >&2
  echo "then: git rebase --continue && git push" >&2
  exit 1
fi
git push -q
echo "Published."
'''

# --- Background jobs (systemd user units; skipped where there is no user manager,
# such as containers, or WSL without systemd=true in /etc/wsl.conf) ---------------
# At login: pull the repository if nothing is modified locally, then apply it.
# start = false: applying the config must not run it (it would apply again).
[bootstrap.linux.systemd.units.dotfiles-sync]
description = "Pull and apply the dotfiles (install.sh --sync)"
type = "oneshot"
exec_start = "~/.dotfiles/install.sh --sync"
timeout_start_sec = "900"
start = false

# Weekly: upgrade the tools in [tools] (what `brew upgrade` used to do).
[bootstrap.linux.systemd.units.mise-upgrade]
description = "Upgrade the mise tools"
type = "oneshot"
exec_start = "~/.local/bin/mise upgrade"
working_directory = "~"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.mise-upgrade-weekly]
description = "Weekly mise upgrade"
on_calendar = "weekly"
persistent = true
randomized_delay_sec = "1h"
unit = "mise-upgrade"
